[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.1.0"
description = "面向研发效能场景的 AI Agent 后端平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "httpx[socks]==0.28.1",
    "openai==2.43.0",
    "pydantic==2.13.4",
    "pyjwt[crypto]==2.13.0",
    "python-dotenv==1.2.2",
    "unidiff==0.7.5",
    "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "starlette==1.2.1",
]

[project.scripts]
devagent = "devagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
